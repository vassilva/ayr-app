appId: com.ceiia.ayr
name: login_conta
---
# 1. ABRIR A APP

- launchApp

# Onboarding – Saltar se aparecer
- scrollUntilVisible:
    element: "Saltar"
    direction: RIGHT
    visibilityPercentage: 20
    timeout: 15000
    optional: true

- tapOn:
    text: "Saltar"
    optional: true

# Aceder ao ecrã de login
- tapOn:
    text: "(Entrar|Login|Iniciar sessão)"
    optional: true


# 2. LOGIN

# Campo Número de telemóvel
- tapOn:
    point: "58%,33%"

- inputText:
    text: "920557161"
    enter: false

- hideKeyboard

# Campo Palavra-passe
- tapOn:
    point: "50%,40%"

- inputText:
    text: "Vi@4048***!!!"
    enter: false

- hideKeyboard

# Botão Login / Seguinte
- tapOn:
    id: "com.ceiia.ayr:id/login_btn"

# Aceitar pop-up se aparecer
- tapOn:
    id: "android:id/button1"
    optional: true

# Validar que login funcionou
- assertVisible:
    id: "com.ceiia.ayr:id/user_settings_movement_iv"


# 3. LOGOUT

# Abrir menu do utilizador
- tapOn:
    id: "com.ceiia.ayr:id/user_settings_movement_iv"

# Tocar em "Sair"
- tapOn:
    text: "Sair"

# Confirmar saída (pop-up)
- tapOn:
    point: "49%,46%"
    optional: true

# Validar que voltou à tela de login
- assertVisible:
    text: "(Entrar|Login|Iniciar sessão)"
