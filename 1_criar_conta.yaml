appId: com.ceiia.ayr
name: criar_conta
---
# 1. ABRIR A APP

- launchApp

# Onboarding – Saltar se aparecer
- scrollUntilVisible:
    element: "Saltar"
    direction: RIGHT
    visibilityPercentage: 20
    timeout: 15000
    optional: true

- tapOn:
    text: "Saltar"
    optional: true

# Aceder ao ecrã de Login / Criar Conta
- tapOn:
    text: "(Entrar|Login|Iniciar sessão)"
    optional: true


# 2. ACEDER AO FORMULÁRIO DE CRIAÇÃO DE CONTA

- tapOn:
    id: "com.ceiia.ayr:id/sign_up_tv"
    optional: false


# 3. PREENCHER FORMULÁRIO

# Primeiro nome
- tapOn:
    point: "50%,19%"
- inputText: "Vicente"

# Último nome
- tapOn:
    point: "50%,29%"
- inputText: "Silva"

# Email
- tapOn:
    point: "50%,39%"
- inputText: "vicente.silva.teste@ayr.com"

# Número de Telemóvel
- tapOn:
    point: "58%,48%"
- inputText: "920557161"

# Palavra-passe
- tapOn:
    id: "com.ceiia.ayr:id/login_password_til"
- tapOn:
    point: "50%,59%"
- inputText: "Vi@4048***!!!"

# Seguinte
- tapOn:
    id: "com.ceiia.ayr:id/next_btn"


# 4. ACEITAR TERMOS

# Aceitar termos
- tapOn:
    point: "7%,52%"

# Criar conta
- tapOn:
    id: "com.ceiia.ayr:id/next_btn"


# 5. INSERIR TOKEN (MANUAL)

# Selecionar campo do token
- tapOn:
    point: "50%,39%"

# O UTILIZADOR INSERE O TOKEN MANUALMENTE E TOCA EM "VERIFICAR"
# Maestro aguarda o popup de sucesso ("Success")
- extendedWaitUntil:
    visible: "Success"
    timeout: 60000


# 6. CONFIRMAÇÃO DE SUCESSO (FECHAR POPUP)

# Clicar no botão OK (ID, texto e coordenada para garantir)
- tapOn:
    id: "android:id/button1"
    optional: true

- tapOn:
    text: "OK"
    optional: true

- tapOn:
    point: "79%,53%"
    optional: true


# 7. PERMISSÕES (se aparecer)

- tapOn:
    id: "android:id/button1"
    optional: true


# 8. LOGOUT

# Abrir menu do utilizador
- tapOn:
    id: "com.ceiia.ayr:id/user_settings_movement_iv"

# Tocar em "Sair"
- tapOn:
    text: "Sair"

# Confirmar saída
- tapOn:
    point: "49%,46%"
    optional: true

# Validar retorno à tela de login
- assertVisible:
    text: "(Entrar|Login|Iniciar sessão)"
