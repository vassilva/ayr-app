appId: com.ceiia.ayr
name: criar_conta
---
# 1. Abrir a aplicação
- launchApp

# 2. Saltar onboarding, se aparecer
- scrollUntilVisible:
    element: "Saltar"
    direction: RIGHT
    visibilityPercentage: 20
    timeout: 15000
    optional: true

# 3. Tocar em "Saltar", se visível
- tapOn:
    text: "Saltar"
    optional: true

# 4. Aceder ao ecrã de Login / Criar Conta, se necessário
- tapOn:
    text: "(Entrar|Login|Iniciar sessão)"
    optional: true

# 5. Abrir formulário de criação de conta
- tapOn:
    id: "com.ceiia.ayr:id/sign_up_tv"

# 6. Preencher primeiro nome
- tapOn:
    point: "50%,19%"
- inputText: "Vicente"

# 7. Preencher último nome
- tapOn:
    point: "50%,29%"
- inputText: "Silva"

# 8. Preencher email
- tapOn:
    point: "50%,39%"
- inputText: "vicente.silva.teste@ayr.com"

# 9. Preencher número de telemóvel
- tapOn:
    point: "58%,48%"
- inputText: "920557161"

# 10. Preencher palavra-passe
- tapOn:
    id: "com.ceiia.ayr:id/login_password_til"
    optional: true
- tapOn:
    point: "50%,59%"
- inputText: "Vi@4048***!!!"

# 11. Avançar para aceitação dos termos
- tapOn:
    id: "com.ceiia.ayr:id/next_btn"

# 12. Aceitar termos
- tapOn:
    point: "7%,52%"

# 13. Confirmar criação de conta
- tapOn:
    id: "com.ceiia.ayr:id/next_btn"

# 14. Selecionar campo do token
- tapOn:
    point: "50%,39%"

# 15. Aguardar sucesso após token inserido manualmente
- extendedWaitUntil:
    visible: "Success"
    timeout: 60000

# 16. Confirmar popup de sucesso
- tapOn:
    id: "android:id/button1"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- tapOn:
    point: "79%,53%"
    optional: true

# 17. Permitir permissões, se aparecer
- tapOn:
    id: "android:id/button1"
    optional: true

# 18. Abrir menu do utilizador
- tapOn:
    id: "com.ceiia.ayr:id/user_settings_movement_iv"

# 19. Fazer logout
- tapOn:
    text: "Sair"

# 20. Confirmar saída
- tapOn:
    point: "49%,46%"
    optional: true

# 21. Validar retorno à tela de login
- assertVisible:
    text: "(Entrar|Login|Iniciar sessão)"
    